<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyfall — MIDI 피아노 리듬게임</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ───────── 메뉴 ───────── -->
<div id="menu" class="screen">
  <header class="top">
    <div>
      <h1>KEYFALL</h1>
      <p class="sub">MIDI 피아노로 치는 리듬게임</p>
    </div>
    <div id="midiStatus" class="pill">MIDI 확인 중…</div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>곡 선택</h2>
      <ul id="songList" class="song-list"></ul>
      <label id="dropZone" class="drop">
        <input type="file" id="midiFile" accept=".mid,.midi" hidden>
        <strong>MIDI 파일 불러오기</strong>
        <span>.mid 파일을 여기에 끌어다 놓거나 클릭</span>
      </label>
    </section>

    <section class="panel">
      <h2 id="songTitle">곡을 선택하세요</h2>
      <div id="songMeta" class="meta"></div>
      <div id="partList" class="parts"></div>
      <button id="startBtn" class="primary" disabled>시작 <kbd>Enter</kbd></button>
    </section>

    <section class="panel">
      <h2>설정</h2>
      <div class="field">
        <span>모드</span>
        <div class="seg">
          <label><input type="radio" name="mode" value="seven"><span>7키 (도~시)</span></label>
          <label><input type="radio" name="mode" value="piano"><span>피아노 건반</span></label>
        </div>
      </div>
      <div class="field">
        <span>노트 속도 <b id="speedVal"></b></span>
        <input type="range" id="speed" min="1" max="8" step="0.5">
      </div>
      <div class="field">
        <span>곡 재생 속도 (연습용)</span>
        <select id="rate">
          <option value="0.5">50%</option><option value="0.6">60%</option>
          <option value="0.7">70%</option><option value="0.8">80%</option>
          <option value="0.9">90%</option><option value="1">100%</option>
        </select>
      </div>
      <div class="field">
        <span>판정 오프셋 <b id="offsetVal"></b></span>
        <input type="range" id="offset" min="-150" max="150" step="5">
        <small>+ 값: 늦게 쳐도 정확하게 판정 (입력 지연 보정)</small>
      </div>
      <div class="field">
        <span>건반 소리 (게임에서 재생)</span>
        <select id="keySound">
          <option value="auto">자동 (컴퓨터 키보드만)</option>
          <option value="on">항상 켜기</option>
          <option value="off">끄기</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="longNotes"> 롱노트 (긴 음은 누르고 있기)</label>
      <label class="check"><input type="checkbox" id="noFail"> 실패 없음 (연습 모드)</label>
      <label class="check"><input type="checkbox" id="autoplay"> 오토 플레이 (데모)</label>

      <h3>입력 테스트</h3>
      <div id="inputTest" class="input-test">건반을 눌러보세요</div>
      <p class="help" id="keyHelp"></p>
    </section>
  </main>
</div>

<!-- ───────── 게임 ───────── -->
<div id="game" class="screen hidden">
  <canvas id="cv"></canvas>
  <div id="pauseMenu" class="overlay hidden">
    <div class="card">
      <h2>일시정지</h2>
      <button id="resumeBtn" class="primary">계속하기 <kbd>Esc</kbd></button>
      <button id="restartBtn">처음부터 <kbd>R</kbd></button>
      <button id="quitBtn">메뉴로 <kbd>Q</kbd></button>
    </div>
  </div>
</div>

<!-- ───────── 결과 ───────── -->
<div id="result" class="screen hidden">
  <div class="card result-card">
    <p id="resTitle" class="res-title"></p>
    <div id="resRank" class="rank"></div>
    <p id="resState" class="res-state"></p>
    <div class="res-grid">
      <div><span>점수</span><b id="resScore"></b></div>
      <div><span>정확도</span><b id="resAcc"></b></div>
      <div><span>최대 콤보</span><b id="resCombo"></b></div>
    </div>
    <div class="res-judges">
      <div class="j-cool"><span>COOL</span><b id="resCool"></b></div>
      <div class="j-good"><span>GOOD</span><b id="resGood"></b></div>
      <div class="j-bad"><span>BAD</span><b id="resBad"></b></div>
      <div class="j-miss"><span>MISS</span><b id="resMiss"></b></div>
    </div>
    <p id="resFastSlow" class="fastslow"></p>
    <div class="row">
      <button id="retryBtn" class="primary">다시하기 <kbd>R</kbd></button>
      <button id="menuBtn">메뉴로 <kbd>Esc</kbd></button>
    </div>
  </div>
</div>

<script src="js/midi-file.js"></script>
<script src="js/songs.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
